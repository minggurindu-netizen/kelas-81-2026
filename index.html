function renderTabel(data) {
  const tbody = document.getElementById('siswaBody');
  tbody.innerHTML = '';
  data.forEach((siswa, index) => {
    const nilaiArr = Object.values(siswa.nilai);
    const avg = (nilaiArr.reduce((a, b) => a + b, 0) / nilaiArr.length).toFixed(1);
    
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${index + 1}</td>
      <td><span class="nama-link" onclick="bukaModal('${siswa.nama}')">${siswa.nama}</span></td>
      <td><strong>${avg}</strong></td>
      <td><button class="btn-detail" onclick="bukaModal('${siswa.nama}')">Detail Nilai</button></td>
    `;
    tbody.appendChild(tr);
  });
}

function filterSiswa() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const filtered = dataSiswa.filter(s => s.nama.toLowerCase().includes(query));
  renderTabel(filtered);
}

function bukaModal(nama) {
  const siswa = dataSiswa.find(s => s.nama === nama);
  if (!siswa) return;
  
  document.getElementById('modalNama').innerText = "Detail Nilai: " + siswa.nama;
  const content = document.getElementById('modalNilaiContent');
  content.innerHTML = '';
  
  for (const [mapel, nilai] of Object.entries(siswa.nilai)) {
    const div = document.createElement('div');
    div.className = 'item-nilai';
    div.innerHTML = `<span><strong>${mapel}</strong></span> <span>${nilai}</span>`;
    content.appendChild(div);
  }
  
  document.getElementById('modalNilai').style.display = 'block';
}

function tutupModal() {
  document.getElementById('modalNilai').style.display = 'none';
}

window.onclick = function(event) {
  const modal = document.getElementById('modalNilai');
  if (event.target === modal) {
    modal.style.display = 'none';
  }
}

// Render data awal
renderTabel(dataSiswa);
